[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-graph-lab"
version = "0.1.0"
description = "The same questions answered by a hand-written agent loop, a LangGraph agent and a LangGraph multi-agent team, measured on one eval"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "langgraph>=1.0",
    "mcp>=2.2,<3",
    "mcpkb @ git+https://github.com/ihkuzu/mcp-knowledge-server.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
agentlab = "agentlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
